<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chính – chờ GPS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#050608}
*{box-sizing:border-box}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
@keyframes ring{0%{transform:scale(.55);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.ring{animation:ring 2.8s ease-out infinite;transform-origin:195px 400px}
.ring2{animation:ring 2.8s ease-out 1.4s infinite;transform-origin:195px 400px}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.d1{animation:blink 1.4s infinite}.d2{animation:blink 1.4s .2s infinite}.d3{animation:blink 1.4s .4s infinite}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#050608;color:#F5F6F8;font-family:'Manrope',system-ui,sans-serif">
<svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position:absolute;left:0;top:0">
<g fill="none" stroke="#161920" stroke-width="1">
<circle cx="195" cy="400" r="80"/>
<circle cx="195" cy="400" r="150"/>
<circle cx="195" cy="400" r="220"/>
</g>
<g fill="none" stroke="#6EE7B7" stroke-width="1.5">
<circle class="ring" cx="195" cy="400" r="150"/>
<circle class="ring2" cx="195" cy="400" r="150"/>
</g>
</svg>
<div style="position:relative;height:100%;display:flex;flex-direction:column">

<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0 24px;height:72px">
<div style="display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;letter-spacing:-.01em">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F5F6F8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
Tọa Độ
</div>
<button aria-label="Đổi ngôn ngữ" style="height:44px;padding:0 16px;border-radius:999px;border:1px solid #23262E;background:#0C0E12;color:#C9CED8;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
English
</button>
</div>

<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 24px;text-align:center">
<div style="width:72px;height:72px;border-radius:50%;background:#0F1A16;border:1px solid #1E3A30;display:flex;align-items:center;justify-content:center">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#6EE7B7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
</div>
<div style="display:flex;flex-direction:column;gap:10px;align-items:center">
<div style="font-size:20px;font-weight:700;letter-spacing:-.01em">Đang chờ tín hiệu GPS…</div>
<div style="display:flex;gap:7px">
<span class="d1" style="width:7px;height:7px;border-radius:50%;background:#6EE7B7"></span>
<span class="d2" style="width:7px;height:7px;border-radius:50%;background:#6EE7B7"></span>
<span class="d3" style="width:7px;height:7px;border-radius:50%;background:#6EE7B7"></span>
</div>
</div>
<div class="num" style="display:flex;flex-direction:column;gap:10px;margin-top:10px;font-size:38px;font-weight:700;letter-spacing:-.02em;color:#23262E;line-height:1">
<div>––°––'––"<span style="font-size:.6em;margin-left:.18em">N</span></div>
<div>–––°––'––"<span style="font-size:.6em;margin-left:.18em">E</span></div>
</div>
</div>

<div style="padding:0 24px 32px;display:flex;flex-direction:column;gap:10px">
<button disabled aria-disabled="true" style="height:60px;border-radius:999px;border:0;background:#14171D;color:#7D8390;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px">
Xem
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
</button>
<button style="height:52px;border-radius:999px;border:1px solid #23262E;background:transparent;color:#F5F6F8;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l11-11-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
Nhập tay
</button>
</div>

</div>
</div>
</x-dc>

</body>
</html>
